version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "nuxt"
          - "@nuxt/*"
    ignore:
      # Nuxt/Nuxt UI major bumps tend to need manual migration work; leave
      # those for a deliberate upgrade rather than an automated PR.
      - dependency-name: "nuxt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nuxt/ui"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
